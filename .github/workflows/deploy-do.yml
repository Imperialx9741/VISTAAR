name: Deploy Backend to DigitalOcean (DEPRECATED)

# DEPRECATED 2026-09-03 (ADR-0063) — the owner switched the deployment
# target to AWS only, explicitly instructing "Do not use DigitalOcean."
# Kept in the repo for the historical record, not deleted, but replaced
# by deploy-aws.yml as the active deploy path. Do not run this workflow
# against real infrastructure.
#
# ADR-0035 / technical-architecture.md §64. Manual dispatch only — this
# is deliberately NOT wired to run on every push to main yet. Turning
# on automatic deploys is a real operational decision the owner should
# make explicitly (how much CI verification should gate a production
# rollout, whether staging/production need separate approval), not one
# this task invents by silently attaching this workflow to the `push`
# trigger the way ci.yml already uses for tests. Until then, run it via
# the Actions tab's "Run workflow" button.
#
# Requires these repository secrets, none of which exist yet:
#   DIGITALOCEAN_ACCESS_TOKEN  — doctl / terraform auth
#   DOCR_REGISTRY              — e.g. registry.digitalocean.com/vistaar
#   DOKS_CLUSTER_NAME           — from `terraform output` in
#                                  infrastructure/terraform/digitalocean
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compute Image Tag
        id: tag
        run: echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Build Image
        working-directory: apps/backend
        run: |
          docker build \
            -t "${{ secrets.DOCR_REGISTRY }}/vistaar-backend:${{ steps.tag.outputs.image_tag }}" \
            -t "${{ secrets.DOCR_REGISTRY }}/vistaar-backend:latest" \
            .

      - name: Push Image
        run: |
          docker push "${{ secrets.DOCR_REGISTRY }}/vistaar-backend:${{ steps.tag.outputs.image_tag }}"
          docker push "${{ secrets.DOCR_REGISTRY }}/vistaar-backend:latest"

  migrate-and-deploy:
    name: Migrate & Deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DOKS kubeconfig
        run: doctl kubernetes cluster kubeconfig save "${{ secrets.DOKS_CLUSTER_NAME }}"

      - name: Render Manifests
        working-directory: infrastructure/kubernetes
        run: |
          IMAGE="${{ secrets.DOCR_REGISTRY }}/vistaar-backend:${{ needs.build-and-push.outputs.image_tag }}"
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          sed -i "s#REPLACE_ME_REGISTRY/vistaar-backend:REPLACE_ME_TAG#${IMAGE}#g" backend-migrate-job.yaml backend-deployment.yaml celery-worker-deployment.yaml
          sed -i "s#REPLACE_ME_TAG#${TAG}#g" backend-migrate-job.yaml

      - name: Run Migration Job
        working-directory: infrastructure/kubernetes
        run: |
          kubectl apply -f backend-migrate-job.yaml
          kubectl wait --for=condition=complete --timeout=180s \
            "job/vistaar-backend-migrate-${{ needs.build-and-push.outputs.image_tag }}" -n vistaar
          kubectl delete "job/vistaar-backend-migrate-${{ needs.build-and-push.outputs.image_tag }}" -n vistaar

      - name: Apply Deployment
        working-directory: infrastructure/kubernetes
        run: |
          kubectl apply -f backend-deployment.yaml
          kubectl rollout status deployment/vistaar-backend -n vistaar --timeout=180s
          kubectl apply -f celery-worker-deployment.yaml
          kubectl rollout status deployment/vistaar-celery-worker -n vistaar --timeout=180s
