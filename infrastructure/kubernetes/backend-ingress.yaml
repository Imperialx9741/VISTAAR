# Requires the AWS Load Balancer Controller installed on the cluster
# first (owner decision, 2026-09-03: "Use AWS Application Load Balancer
# with the AWS Load Balancer Controller... Do not use community
# Ingress-NGINX for the new production deployment") — see
# infrastructure/kubernetes/README.md for the exact Helm install steps
# and the IAM role infrastructure/terraform/aws/eks.tf provisions for
# it (IRSA). Not provisioned by this file — a Helm chart install run
# once the cluster exists, same "not Terraform-applied" treatment
# cert-manager always had here.
#
# TLS is ACM-terminated at the ALB itself, not cert-manager/Let's
# Encrypt in-cluster — the idiomatic pattern for an ALB Ingress
# (`alb.ingress.kubernetes.io/certificate-arn`), simpler than running
# cert-manager for a certificate AWS already manages and auto-renews.
# No cert-manager installation is needed for this Ingress at all.
#
# REPLACE_ME_DOMAIN and REPLACE_ME_ACM_CERTIFICATE_ARN are deliberately
# left as placeholders — the real API domain and its ACM certificate
# are the owner's decisions/AWS Console actions, not values to invent.
# Request/validate the ACM certificate for REPLACE_ME_DOMAIN first
# (`aws acm request-certificate --domain-name ... --validation-method
# DNS`), then copy its ARN in below.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vistaar-backend
  namespace: vistaar
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    # target-type: ip routes ALB traffic directly to pod IPs via the
    # VPC CNI (infrastructure/terraform/aws/vpc.tf's own subnets) —
    # the recommended mode for EKS, vs. the "instance" mode's extra
    # NodePort hop.
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: REPLACE_ME_ACM_CERTIFICATE_ARN
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  rules:
    - host: REPLACE_ME_DOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vistaar-backend
                port:
                  number: 80
