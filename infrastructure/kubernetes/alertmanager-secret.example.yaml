# TEMPLATE — not a real Secret (ADR-0053 + the 2026-09-03 alerting
# addition; receiver switched from a generic webhook to Slack,
# 2026-09-03 — owner decision, real Slack incoming webhook created for
# #vistaar-alerts). Copy to alertmanager-secret.yaml, replace the
# placeholder `slack_api_url` below with the real Slack incoming
# webhook URL (kept in the local `.env` as ALERTMANAGER_SLACK_WEBHOOK_URL
# for docker-compose dev — see infrastructure/docker/docker-compose.dev.yml
# — and must be supplied the same way here, out of band, never committed),
# and apply directly — do NOT commit the filled-in file, same "prefer
# kubectl create secret / a real secret manager over checking in
# filled-in YAML" guidance backend-secret.example.yaml already gives.
#
# The placeholder below must stay a syntactically valid URL, not a bare
# "REPLACE_ME" string — verified for real against amtool check-config:
# Alertmanager validates a configured API URL's scheme at config-load
# time, before it ever tries to send anything, so an invalid URL string
# crash-loops the whole pod on startup rather than just failing silently
# to notify. A real https:// URL that resolves to nothing is safe: the
# pod starts, alerts fire and are visible in its own UI, and only the
# outbound Slack POST fails (logged, not fatal) until a real URL
# replaces it.
apiVersion: v1
kind: Secret
metadata:
  name: vistaar-alertmanager-secret
  namespace: vistaar
type: Opaque
stringData:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      slack_api_url: "https://REPLACE_ME.example.invalid/webhook"
    route:
      receiver: slack-vistaar-alerts
      group_by: ["alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: slack-vistaar-alerts
        slack_configs:
          - channel: "#vistaar-alerts"
            send_resolved: true
            title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'
