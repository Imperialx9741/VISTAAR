# TEMPLATE — not a real Secret. Copy this file to backend-secret.yaml,
# fill in real values from `terraform output` (infrastructure/terraform
# /aws — ADR-0063, superseding the earlier DigitalOcean-specific
# version of this file) and the owner's real MSG91/Razorpay/SBI
# credentials, and apply it directly — do NOT commit the filled-in file
# (backend-secret.yaml is intentionally left out of this directory /
# should be added to .gitignore if a real one is ever written to disk
# here).
#
# Prefer `kubectl create secret generic vistaar-backend-secret
# --from-literal=...` or a real secret manager (AWS Secrets Manager,
# integrated with EKS via the External Secrets Operator or the AWS
# Secrets Manager CSI driver, is the natural choice on this deployment
# target — a real improvement over the superseded DigitalOcean plan,
# which had no native secret-manager offering at all) over checking in
# filled-in YAML — this template exists to document the exact key
# names core/config.py and modules/identity/config.py expect. Not
# necessarily exhaustive against the very latest core/config.py — cross-
# check apps/backend/.env.example, the single source of truth for every
# configurable key, before a real production fill-in.
apiVersion: v1
kind: Secret
metadata:
  name: vistaar-backend-secret
  namespace: vistaar
type: Opaque
stringData:
  # From `terraform output database_url` (RDS PostgreSQL, PostGIS
  # extension enabled — see infrastructure/terraform/aws/rds.tf).
  DATABASE_URL: "postgresql://REPLACE_ME@REPLACE_ME.rds.amazonaws.com:5432/vistaar_db?sslmode=require"
  # From `terraform output redis_url` (ElastiCache for Redis).
  REDIS_URL: "rediss://REPLACE_ME.cache.amazonaws.com:6379/0"
  # AWS S3 (ADR-0031, ADR-0063 §1) — STORAGE_ENDPOINT deliberately
  # absent: real AWS S3 needs no override (boto3's own default endpoint
  # resolution), unlike the superseded DigitalOcean Spaces setup.
  STORAGE_ACCESS_KEY: "REPLACE_ME"
  STORAGE_SECRET_KEY: "REPLACE_ME"
  # Must be a strong, random 32+ char secret in production — never the
  # apps/backend/.env.example placeholder value.
  JWT_SECRET: "REPLACE_ME"
  MSG91_AUTH_KEY: "REPLACE_ME"
  MSG91_TEMPLATE_ID: "REPLACE_ME"
  MSG91_NOTIFICATION_TEMPLATE_ID: "REPLACE_ME"
  # Sarthi Wallet Recharge (ADR-0060) — Razorpay is TEST/DEVELOPMENT
  # only (owner's explicit instruction); SBI is the planned production
  # gateway, not yet integrated (credentials pending). Set
  # WALLET_RECHARGE_PROVIDER=dev in backend-configmap.yaml (not here)
  # until real Razorpay TEST or SBI production credentials are ready to
  # go here.
  RAZORPAY_KEY_ID: "REPLACE_ME"
  RAZORPAY_KEY_SECRET: "REPLACE_ME"
  RAZORPAY_WEBHOOK_SECRET: "REPLACE_ME"
  # Dead config predating the P2P ride-fare model (ADR-0025/ADR-0026) —
  # unused by any code path (see .env.example's own note). Left here
  # only so this template still matches every key core/config.py
  # declares; do not fill in real values for these.
  PAYMENT_API_KEY: "REPLACE_ME"
  PAYMENT_WEBHOOK_SECRET: "REPLACE_ME"
  # Monitoring (ADR-0053) — the real Sentry project's DSN. Safe to leave
  # blank in a non-production environment; sentry_sdk.init() treats an
  # empty DSN as "disabled" on its own.
  SENTRY_DSN: "REPLACE_ME"
  # Push Notifications (ADR-0052) — set PUSH_PROVIDER=fcm in
  # backend-configmap.yaml once ready. FCM_SERVICE_ACCOUNT_JSON is a
  # *file path*, not a literal value, so it can't be a plain stringData
  # entry here the way the keys above are: mount the Firebase service-
  # account JSON as its own Secret volume on backend-deployment.yaml
  # (e.g. `kubectl create secret generic vistaar-fcm-credentials
  # --from-file=service-account.json=<path>`) and point
  # FCM_SERVICE_ACCOUNT_JSON (backend-configmap.yaml) at the mounted
  # path, not at a value in this file.
