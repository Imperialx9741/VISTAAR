services:
  postgres:
    image: postgres:16-alpine
    container_name: vistaar-postgres-dev
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
      POSTGRES_DB: vistaar_db
    volumes:
      - vistaar_postgres_data:/var/lib/postgresql/data
    networks:
      - vistaar_dev_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_user -d vistaar_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: vistaar-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vistaar_redis_data:/data
    networks:
      - vistaar_dev_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  kafka:
    image: apache/kafka:3.7.0
    container_name: vistaar-kafka-dev
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - vistaar_kafka_data:/var/lib/kafka/data
    networks:
      - vistaar_dev_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  vistaar_postgres_data:
    name: vistaar_postgres_data
  vistaar_redis_data:
    name: vistaar_redis_data
  vistaar_kafka_data:
    name: vistaar_kafka_data

networks:
  vistaar_dev_network:
    name: vistaar_dev_network
    driver: bridge
