# Auto-loads every dashboard JSON in ../../dashboards on Grafana startup
# (ADR-0053) — no manual import needed for local dev.
apiVersion: 1

providers:
  - name: VISTAAR
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
