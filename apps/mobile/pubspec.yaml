name: vistaar_mobile
description: "VISTAAR unified mobile app — User and Sarthi (driver), role selected at login. See docs/14-decisions/ADR-0027-unified-mobile-app-role-based-login.md."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # HTTP client for calling the FastAPI backend (api-contracts.md).
  http: ^1.2.0
  # Minimal, official-ecosystem state management for sharing auth session
  # state (role, tokens) across screens — chosen deliberately light for
  # this first login-only slice; a future task may reconsider once more
  # screens exist (ADR-0027 §4).
  provider: ^6.1.2
  # Persists the auth session (role + tokens) across app restarts in the
  # platform keychain/keystore — see lib/core/storage/token_storage.dart.
  flutter_secure_storage: ^11.0.0
  # Location permission + position (Admin Web plan §6.1, owner decision
  # 2026-08-29) — see lib/features/location/location_permission_screen.dart.
  # The standard, official-ecosystem package for this; wraps the native
  # iOS/Android permission dialogs and position APIs directly, no custom
  # platform-channel code needed.
  geolocator: ^14.0.0
  # Generates the Idempotency-Key required by accept-offer
  # (api-contracts.md §16.3, ADR-0014) — a v4 UUID per accept *attempt*,
  # reused across retries of that same attempt so a retried tap replays
  # idempotently instead of risking a double accept.
  uuid: ^4.5.1
  # Push notifications (ADR-0052, build order step 9/11). ONE Firebase
  # project ("VISTAAR Production", vistaar-production-3a79a), ONE
  # Flutter app for both roles — lib/firebase_options.dart (FlutterFire
  # CLI output, gitignored) already covers Android/iOS/Web from this
  # single app registration; no separate per-role config needed.
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_contacts: ^2.3.1
  # Sarthi Wallet Recharge (ADR-0060, 2026-09-02) — the official Razorpay
  # Checkout SDK wrapper, used only to drive Razorpay's own hosted
  # checkout UI (TEST-mode gateway; see ADR-0060 §5 for what changes if
  # the production gateway ever becomes something other than Razorpay).
  # This app never handles card/UPI details itself — the checkout screen
  # this package launches is Razorpay's own, and only an opaque
  # order_id/payment_id/signature triplet is reported back to it.
  razorpay_flutter: ^1.4.0
  # Real camera/gallery capture for document and GPS-dispute evidence
  # uploads (2026-09-04) — closes the "free-text reference instead of a
  # real photo" gap `SarthiOnboardingScreen`/`GpsDisputeScreen` both
  # flagged in their own doc comments. The official-ecosystem package
  # for this; wraps the native camera/photo-library UI directly (on
  # Android 13+, the system Photo Picker — no runtime storage permission
  # needed for gallery at all). See lib/core/uploads/evidence_upload_service.dart.
  image_picker: ^1.1.2
  # Map rendering (2026-09-07) — the owner's final maps-provider
  # decision was MapTiler Cloud (mobile-app-implementation-plan.md,
  # "Owner decisions confirmed in a third round"), key already wired
  # via AppConfig.mapTilerApiKey but never called by any screen until
  # now. flutter_map is the standard, official-ecosystem Flutter map
  # widget for any raster/vector XYZ tile URL — not Google Maps or the
  # Mapbox SDK, neither of which matches the credential actually
  # provided. See lib/shared/map/maptiler_tile_layer.dart.
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  # VISTAAR Design System (2026-09-08, owner-requested UI/UX redesign,
  # Phase 2) — real, distinctive typography instead of the platform
  # default font. Official Google-run package, the standard Flutter way
  # to bundle a real typeface without shipping font files by hand. See
  # lib/shared/design/vistaar_typography.dart — the one file that picks
  # the actual faces.
  google_fonts: ^6.2.1
  # Error tracking (2026-09-08, owner decision — mirrors the backend's
  # own Sentry wiring, ADR-0053, but as its own separate Sentry project
  # so mobile crashes don't mix into the backend's error feed). Official
  # Sentry-maintained Flutter SDK — the standard choice, not a third-
  # party wrapper.
  sentry_flutter: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # geolocator's own documented testing seam (GeolocatorPlatform.instance)
  # — test-only, used by test/features/location/location_permission_
  # screen_test.dart's FakeGeolocatorPlatform.
  geolocator_platform_interface: ^4.3.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Regenerates the Android/iOS launcher icon from one source image
  # (2026-09-08, owner-directed brand/logo parity with apps/admin-web) —
  # the official-ecosystem package for this; writes every mipmap/asset-
  # catalog density itself rather than five hand-edited PNGs per
  # platform. Dev-only: it's a one-shot generator (`dart run
  # flutter_launcher_icons`), not something the running app depends on.
  flutter_launcher_icons: ^0.14.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# Generates the on-device launcher icon (`dart run
# flutter_launcher_icons`) from VistaarLogoMark's own gold-badge/deep-
# green-"V" design (lib/shared/design/vistaar_logo.dart) — the same
# mark as apps/admin-web's `.brandMark`, so the app icon, the in-app
# logo, and the admin dashboard's own mark are one design, not three.
# assets/icon/icon.png is the full-bleed legacy/iOS icon; icon_foreground
# is the "V" alone (transparent) for Android's adaptive-icon safe zone,
# paired with a flat gold adaptive_icon_background rather than baking
# the background into that image.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#EFBF04"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
